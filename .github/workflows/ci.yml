name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          xcodebuild \
            -project Watchdog.xcodeproj \
            -scheme Watchdog \
            -configuration Debug \
            -derivedDataPath DerivedData/unit \
            test \
            -only-testing:WatchdogTests

      - name: Run shipping UI safety tests
        run: |
          xcodebuild \
            -project Watchdog.xcodeproj \
            -scheme Watchdog \
            -configuration Debug \
            -derivedDataPath DerivedData/ui \
            test \
            -only-testing:WatchdogUITests

      - name: Build Debug
        run: |
          xcodebuild \
            -project Watchdog.xcodeproj \
            -scheme Watchdog \
            -configuration Debug \
            -derivedDataPath DerivedData/debug \
            build

      - name: Build Release
        run: |
          xcodebuild \
            -project Watchdog.xcodeproj \
            -scheme Watchdog \
            -configuration Release \
            -derivedDataPath DerivedData/release \
            build
